<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 — Arcade</title>
<link rel="stylesheet" href="../styles.css">
<style>
  .board-wrap{ position:relative; }
  .board2048{
    display:grid;
    grid-template-columns:repeat(4,76px);
    grid-template-rows:repeat(4,76px);
    gap:10px;
    background:var(--ink);
    padding:10px;
    border-radius:10px;
    border:2px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
  }
  .tile{
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--line);
    border-radius:6px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:1.35rem;
    color:var(--ink);
  }
  .overlay-msg{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:rgba(247,247,245,.94);
    text-align:center;
    padding:20px;
    border-radius:10px;
  }
  .overlay-msg.show{ display:flex; }
  .overlay-msg h2{
    font-family:'Fraunces',serif;
    font-style:italic;
    margin:0;
    font-size:1.3rem;
  }
  @media (max-width:420px){
    .board2048{ grid-template-columns:repeat(4,64px); grid-template-rows:repeat(4,64px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="game-header"><a class="back-link" href="../index.html">← Arcade</a></div>
  <h1 class="game-title">2048</h1>

  <div class="game-stage">
    <div class="hud">
      <span>Score <strong id="score">0</strong></span>
      <span>Best <strong id="best">0</strong></span>
    </div>

    <div class="board-wrap">
      <div class="board2048" id="board"></div>
      <div class="overlay-msg" id="overlayMsg">
        <h2 id="overlayText">Game over</h2>
        <button class="btn" id="restartBtn">Try again</button>
      </div>
    </div>

    <p style="color:var(--muted); font-size:.85rem;">Arrow keys to slide. Matching tiles merge.</p>
  </div>
</div>
<script src="2048.js"></script>
</body>
</html>
