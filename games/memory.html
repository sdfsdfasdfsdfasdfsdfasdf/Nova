<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory — Arcade</title>
<link rel="stylesheet" href="../styles.css">
<style>
  .board-memory{
    display:grid;
    grid-template-columns:repeat(4,72px);
    grid-template-rows:repeat(4,72px);
    gap:10px;
  }
  .card{
    border:2px solid var(--ink);
    border-radius:8px;
    background:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6rem;
    cursor:pointer;
    user-select:none;
  }
  .card.flipped, .card.matched{
    background:var(--paper);
  }
  .card.matched{
    opacity:.45;
    cursor:default;
  }
  .win-msg{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:1.2rem;
    display:none;
    margin:0;
  }
  .win-msg.show{ display:block; }
  @media (max-width:380px){
    .board-memory{ grid-template-columns:repeat(4,60px); grid-template-rows:repeat(4,60px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="game-header"><a class="back-link" href="../index.html">← Arcade</a></div>
  <h1 class="game-title">Memory</h1>

  <div class="game-stage">
    <div class="hud">
      <span>Moves <strong id="moves">0</strong></span>
      <span>Time <strong id="time">0:00</strong></span>
    </div>

    <div class="board-memory" id="board"></div>

    <p class="win-msg" id="winMsg">Cleared in <span id="winMoves"></span> moves.</p>
    <button class="btn" id="restartBtn">New game</button>
  </div>
</div>
<script src="memory.js"></script>
</body>
</html>
